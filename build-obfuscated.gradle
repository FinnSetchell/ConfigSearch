plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loomVersion}"
	id 'me.modmuss50.mod-publish-plugin' version '0.8.4'
	id 'maven-publish'
}

version = project.modVersion
group = project.mavenGroup

base {
	archivesName = "${project.modId}-${project.branchName}-${stonecutter.current.version}"
}

repositories {
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		name = 'isXander'
		url = 'https://maven.isxander.dev/releases/'
	}
	maven {
		name = 'shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'CurseMaven'
		url = 'https://cursemaven.com'
		content {
			includeGroup 'curse.maven'
		}
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${stonecutter.current.version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loaderVersion}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabricApiVersion}"

	modImplementation "com.terraformersmc:modmenu:${project.modMenuVersion}"

	modCompileOnly "dev.isxander:yet-another-config-lib:${project.yaclVersion}"
	modLocalRuntime "dev.isxander:yet-another-config-lib:${project.yaclVersion}"

	modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.clothConfigVersion}"
	modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.clothConfigVersion}"

	modCompileOnly "maven.modrinth:midnightlib:${project.midnightlibVersion}"
	modLocalRuntime "maven.modrinth:midnightlib:${project.midnightlibVersion}"

	if (project.fcapVersion) {
		modCompileOnly "maven.modrinth:forge-config-api-port:${project.fcapVersion}"
		modLocalRuntime "maven.modrinth:forge-config-api-port:${project.fcapVersion}"
		compileOnly "com.electronwill.night-config:core:${project.nightConfigVersion}"
	}

	if (project.configuredFileId) {
		modCompileOnly "curse.maven:configured-457570:${project.configuredFileId}"
		modLocalRuntime "curse.maven:configured-457570:${project.configuredFileId}"
	}
}

processResources {
	def version = project.version
	def minecraftDep = project.minecraftDep
	def javaVersion = project.javaVersion
	inputs.property "version", version
	inputs.property "minecraftDep", minecraftDep
	inputs.property "javaVersion", javaVersion

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraftDep": minecraftDep, "javaVersion": javaVersion
	}

	filesMatching("configsearch.mixins.json") {
		expand "javaVersion": javaVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(project.javaVersion)
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(project.javaVersion)
	targetCompatibility = JavaVersion.toVersion(project.javaVersion)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}

import me.modmuss50.mpp.ReleaseType

def changelogFile = rootProject.file('CHANGELOG.md')
def changelogText = ''
if (changelogFile.exists()) {
	def fullText = changelogFile.getText('UTF-8')
	def quoted = java.util.regex.Pattern.quote(project.modVersion.toString())
	def pattern = java.util.regex.Pattern.compile(
		'## \\[' + quoted + '\\] - \\d{4}-\\d{2}-\\d{2}\\r?\\n(.*?)(?=\\r?\\n---|\\r?\\n## \\[|\\z)',
		java.util.regex.Pattern.DOTALL
	)
	def matcher = pattern.matcher(fullText)
	if (matcher.find()) {
		changelogText = matcher.group(1).trim()
	} else {
		changelogText = fullText
	}
}

def releaseChannel = (project.findProperty('releaseType') ?: 'minor').toString() == 'alpha'
	? ReleaseType.ALPHA
	: ReleaseType.STABLE

publishMods {
	file = tasks.named('remapJar').flatMap { it.archiveFile }
	changelog = changelogText
	version = "${project.modVersion}-${project.branchName}-${stonecutter.current.version}"
	type = releaseChannel
	displayName = "Config Search ${project.modVersion}-${project.branchName}-${stonecutter.current.version}"
	modLoaders.add(project.branchName.toString())
	maxRetries = 3
	dryRun = (project.findProperty('publishDryRun') ?: 'false').toString().toBoolean()

	modrinth {
		accessToken = providers.environmentVariable('MODRINTH_API_KEY')
		projectId = (project.findProperty('modrinthProjectId') ?: '').toString()
		minecraftVersionRange {
			start = project.findProperty('publishMcStart')
			end = project.findProperty('publishMcEnd')
		}
	}

	curseforge {
		accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
		projectId = (project.findProperty('curseforgeProjectId') ?: '').toString()
		projectSlug = (project.findProperty('curseforgeProjectSlug') ?: '').toString()
		clientRequired = true
		serverRequired = false
		minecraftVersionRange {
			start = project.findProperty('publishMcStart')
			end = project.findProperty('publishMcEnd')
		}
	}
}

tasks.named('publishMods').configure {
	dependsOn tasks.named('remapJar')
}
