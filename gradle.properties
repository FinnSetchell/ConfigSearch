org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=false
org.gradle.configuration-cache=false
dev.kikugie.stonecutter.hard_mode=true

# Project - snake_case, the fleet standard (docs/v2-contracts.md,
# "Fleet conventions"). publish-v2's alpha path patches `mod_version=` and
# refuses to patch a camelCase key.
mod_name=Config Search
mod_id=configsearch
mod_version=1.0.0
maven_group=dev.finndog.configsearch
# Fleet artifact standard: {ModName}-{loader}-{mc}-{version}.jar
archives_base_name=ConfigSearch

# The loader this branch builds; fills the {loader} slot in the jar name.
branch_name=fabric

fabric_loader_version=0.19.3
loom_version=1.17.13

# [VERSIONED] = defined per MC version in versions/<mc>/gradle.properties.
java_version=[VERSIONED]
minecraft_dep=[VERSIONED]
fabric_api_version=[VERSIONED]
mod_menu_version=[VERSIONED]
yacl_version=[VERSIONED]
cloth_config_version=[VERSIONED]
midnightlib_version=[VERSIONED]
