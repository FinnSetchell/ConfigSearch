plugins {
	id 'java'
	id 'maven-publish'
	id 'net.minecraftforge.gradle' version "${forge_gradle_version}"
	id 'net.minecraftforge.renamer' version "${forge_renamer_version}"
}

def mc = stonecutter.current.version
def srgRuntime = stonecutter.eval(mc, '<1.20.5')
def obfuscated = stonecutter.eval(mc, '<26.1')

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${project.branch_name}-${mc}"
}

java {
	withSourcesJar()
	toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
}

minecraft {
	if (obfuscated) {
		mappings channel: 'official', version: mc
	}

	runs {
		configureEach {
			workingDir.convention layout.projectDirectory.dir('run')
		}
		register('client')
	}
}

sourceSets.each {
	def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
	it.output.resourcesDir = dir
	it.java.destinationDirectory = dir
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	maven {
		name = 'shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
	maven {
		name = 'CurseMaven'
		url = 'https://cursemaven.com'
		content {
			includeGroup 'curse.maven'
		}
	}
	mavenCentral()
}

def modDependency = { String coords ->
	srgRuntime ? renamer.dependency(coords) : coords
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${mc}-${project.forge_version}")

	if (project.hasProperty('cloth_config_version') && project.cloth_config_version) {
		def cloth = modDependency("me.shedaniel.cloth:cloth-config-forge:${project.cloth_config_version}")
		compileOnly cloth
		runtimeOnly cloth
	}

	if (project.hasProperty('configured_file_id') && project.configured_file_id) {
		def configured = modDependency("curse.maven:configured-457570:${project.configured_file_id}")
		compileOnly configured
		if (!srgRuntime) {
			runtimeOnly configured
		}
	}

	if (project.hasProperty('night_config_version') && project.night_config_version) {
		compileOnly "com.electronwill.night-config:core:${project.night_config_version}"
	}
}

if (srgRuntime) {
	renamer.mappings.from minecraft.dependency.toSrgFile

	tasks.named('jar', Jar) {
		archiveClassifier = 'dev'
	}

	renamer.classes(tasks.named('jar', Jar)) {
		output = layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}.jar")
	}

	tasks.named('assemble') {
		dependsOn 'renameJar'
	}
}

processResources {
	def version = project.version
	def minecraftDep = project.minecraft_dep
	def javaVersion = project.java_version
	def forgeVersionRange = project.forge_version_range
	def resourcePackFormat = project.resource_pack_format
	inputs.property 'version', version
	inputs.property 'minecraftDep', minecraftDep
	inputs.property 'javaVersion', javaVersion
	inputs.property 'forgeVersionRange', forgeVersionRange
	inputs.property 'resourcePackFormat', resourcePackFormat

	filesMatching('META-INF/mods.toml') {
		expand 'version': version, 'minecraftDep': minecraftDep, 'javaVersion': javaVersion, 'forgeVersionRange': forgeVersionRange
	}
	filesMatching('pack.mcmeta') {
		expand 'resourcePackFormat': resourcePackFormat
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from(rootProject.file('LICENSE')) {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
