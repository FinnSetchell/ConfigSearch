plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${project.branch_name}-${stonecutter.current.version}"
}

repositories {
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases'
	}
	maven {
		name = 'isXander'
		url = 'https://maven.isxander.dev/releases/'
	}
	maven {
		name = 'shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'CurseMaven'
		url = 'https://cursemaven.com'
		content {
			includeGroup 'curse.maven'
		}
	}
	mavenCentral()
}

neoForge {
	version = project.neoforge_version

	if (project.hasProperty('parchment_mappings_version')) {
		parchment {
			mappingsVersion = project.parchment_mappings_version
			minecraftVersion = project.parchment_minecraft_version
		}
	}

	runs {
		client {
			client()
		}
	}

	mods {
		configsearch {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	if (project.hasProperty('yacl_version') && project.yacl_version) {
		compileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
		runtimeOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	}

	if (project.hasProperty('cloth_config_version') && project.cloth_config_version) {
		compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"
		runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"
	}

	if (project.hasProperty('midnightlib_version') && project.midnightlib_version) {
		compileOnly "maven.modrinth:midnightlib:${project.midnightlib_version}"
		runtimeOnly "maven.modrinth:midnightlib:${project.midnightlib_version}"
	}

	if (project.hasProperty('configured_file_id') && project.configured_file_id) {
		compileOnly "curse.maven:configured-457570:${project.configured_file_id}"
		runtimeOnly "curse.maven:configured-457570:${project.configured_file_id}"
	}

	if (project.hasProperty('night_config_version') && project.night_config_version) {
		compileOnly "com.electronwill.night-config:core:${project.night_config_version}"
	}
}

processResources {
	def version = project.version
	def minecraftDep = project.minecraft_dep
	def javaVersion = project.java_version
	inputs.property 'version', version
	inputs.property 'minecraftDep', minecraftDep
	inputs.property 'javaVersion', javaVersion

	def neoForgeVersionRange = project.neoforge_version_range
	inputs.property 'neoForgeVersionRange', neoForgeVersionRange

	filesMatching('META-INF/neoforge.mods.toml') {
		expand 'version': version, 'minecraftDep': minecraftDep, 'javaVersion': javaVersion, 'neoForgeVersionRange': neoForgeVersionRange
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(project.java_version)
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from(rootProject.file('LICENSE')) {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
