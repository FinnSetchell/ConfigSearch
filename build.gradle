plugins {
	id 'net.neoforged.moddev' version "${moddevVersion}"
	id 'me.modmuss50.mod-publish-plugin' version '0.8.4'
	id 'maven-publish'
}

version = project.modVersion
group = project.mavenGroup

base {
	archivesName = "${project.modId}-${project.branchName}-${stonecutter.current.version}"
}

repositories {
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases'
	}
	maven {
		name = 'isXander'
		url = 'https://maven.isxander.dev/releases/'
	}
	maven {
		name = 'shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'CurseMaven'
		url = 'https://cursemaven.com'
		content {
			includeGroup 'curse.maven'
		}
	}
	mavenCentral()
}

neoForge {
	version = project.neoForgeVersion

	if (project.hasProperty('parchmentMappingsVersion')) {
		parchment {
			mappingsVersion = project.parchmentMappingsVersion
			minecraftVersion = project.parchmentMinecraftVersion
		}
	}

	runs {
		client {
			client()
		}
	}

	mods {
		configsearch {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	if (project.hasProperty('yaclVersion') && project.yaclVersion) {
		compileOnly "dev.isxander:yet-another-config-lib:${project.yaclVersion}"
		runtimeOnly "dev.isxander:yet-another-config-lib:${project.yaclVersion}"
	}

	if (project.hasProperty('clothConfigVersion') && project.clothConfigVersion) {
		compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${project.clothConfigVersion}"
		runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:${project.clothConfigVersion}"
	}

	if (project.hasProperty('midnightlibVersion') && project.midnightlibVersion) {
		compileOnly "maven.modrinth:midnightlib:${project.midnightlibVersion}"
		runtimeOnly "maven.modrinth:midnightlib:${project.midnightlibVersion}"
	}

	if (project.hasProperty('configuredFileId') && project.configuredFileId) {
		compileOnly "curse.maven:configured-457570:${project.configuredFileId}"
		runtimeOnly "curse.maven:configured-457570:${project.configuredFileId}"
	}

	if (project.hasProperty('nightConfigVersion') && project.nightConfigVersion) {
		compileOnly "com.electronwill.night-config:core:${project.nightConfigVersion}"
	}
}

processResources {
	def version = project.version
	def minecraftDep = project.minecraftDep
	def javaVersion = project.javaVersion
	inputs.property 'version', version
	inputs.property 'minecraftDep', minecraftDep
	inputs.property 'javaVersion', javaVersion

	def neoForgeVersionRange = project.neoForgeVersionRange
	inputs.property 'neoForgeVersionRange', neoForgeVersionRange

	filesMatching('META-INF/neoforge.mods.toml') {
		expand 'version': version, 'minecraftDep': minecraftDep, 'javaVersion': javaVersion, 'neoForgeVersionRange': neoForgeVersionRange
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(project.javaVersion)
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(project.javaVersion)
	targetCompatibility = JavaVersion.toVersion(project.javaVersion)
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from(rootProject.file('LICENSE')) {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}

import me.modmuss50.mpp.ReleaseType

def changelogFile = rootProject.file('CHANGELOG.md')
def changelogText = ''
if (changelogFile.exists()) {
	def fullText = changelogFile.getText('UTF-8')
	def quoted = java.util.regex.Pattern.quote(project.modVersion.toString())
	def pattern = java.util.regex.Pattern.compile(
		'## \\[' + quoted + '\\] - \\d{4}-\\d{2}-\\d{2}\\r?\\n(.*?)(?=\\r?\\n---|\\r?\\n## \\[|\\z)',
		java.util.regex.Pattern.DOTALL
	)
	def matcher = pattern.matcher(fullText)
	if (matcher.find()) {
		changelogText = matcher.group(1).trim()
	} else {
		changelogText = fullText
	}
}

def releaseChannel = (project.findProperty('releaseType') ?: 'minor').toString() == 'alpha'
	? ReleaseType.ALPHA
	: ReleaseType.STABLE

publishMods {
	file = tasks.named('jar').flatMap { it.archiveFile }
	changelog = changelogText
	version = "${project.modVersion}-${project.branchName}-${stonecutter.current.version}"
	type = releaseChannel
	displayName = "Config Search ${project.modVersion}-${project.branchName}-${stonecutter.current.version}"
	modLoaders.add(project.branchName.toString())
	maxRetries = 3
	dryRun = (project.findProperty('publishDryRun') ?: 'false').toString().toBoolean()

	modrinth {
		accessToken = providers.environmentVariable('MODRINTH_API_KEY')
		projectId = (project.findProperty('modrinthProjectId') ?: '').toString()
		minecraftVersionRange {
			start = project.findProperty('publishMcStart')
			end = project.findProperty('publishMcEnd')
		}
	}

	curseforge {
		accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
		projectId = (project.findProperty('curseforgeProjectId') ?: '').toString()
		projectSlug = (project.findProperty('curseforgeProjectSlug') ?: '').toString()
		clientRequired = true
		serverRequired = false
		minecraftVersionRange {
			start = project.findProperty('publishMcStart')
			end = project.findProperty('publishMcEnd')
		}
	}
}

tasks.named('publishMods').configure {
	dependsOn tasks.named('jar')
}
