plugins {
	id 'net.minecraftforge.gradle' version "${forgeGradleVersion}"
	id 'maven-publish'
}

version = "${project.modVersion}+${stonecutter.current.version}-forge"
group = project.mavenGroup

base {
	archivesName = project.modId
}

repositories {
	maven {
		name = 'MinecraftForge'
		url = 'https://maven.minecraftforge.net/'
	}
	maven {
		name = 'shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
	maven {
		name = 'CurseMaven'
		url = 'https://cursemaven.com'
		content {
			includeGroup 'curse.maven'
		}
	}
	mavenCentral()
}

def useOfficialRuntime = !stonecutter.current.version.startsWith('1.20')

minecraft {
	mappings channel: 'official', version: stonecutter.current.version

	if (useOfficialRuntime) {
		reobf = false
		copyIdeResources = true
	}

	runs {
		client {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'
			mods {
				configsearch {
					source sourceSets.main
				}
			}
		}
	}
}

if (useOfficialRuntime) {
	sourceSets.each {
		def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
		it.output.resourcesDir = dir
		it.java.destinationDirectory = dir
	}
}

dependencies {
	minecraft "net.minecraftforge:forge:${stonecutter.current.version}-${project.forgeVersion}"

	if (project.hasProperty('clothConfigVersion') && project.clothConfigVersion) {
		compileOnly "me.shedaniel.cloth:cloth-config-forge:${project.clothConfigVersion}"
		runtimeOnly "me.shedaniel.cloth:cloth-config-forge:${project.clothConfigVersion}"
	}

	if (project.hasProperty('configuredFileId') && project.configuredFileId) {
		compileOnly "curse.maven:configured-457570:${project.configuredFileId}"
		if (useOfficialRuntime) {
			runtimeOnly "curse.maven:configured-457570:${project.configuredFileId}"
		}
	}

	if (project.hasProperty('nightConfigVersion') && project.nightConfigVersion) {
		compileOnly "com.electronwill.night-config:core:${project.nightConfigVersion}"
	}
}

processResources {
	def version = project.version
	def minecraftDep = project.minecraftDep
	def javaVersion = project.javaVersion
	def forgeVersionRange = project.forgeVersionRange
	inputs.property 'version', version
	inputs.property 'minecraftDep', minecraftDep
	inputs.property 'javaVersion', javaVersion
	inputs.property 'forgeVersionRange', forgeVersionRange

	filesMatching('META-INF/mods.toml') {
		expand 'version': version, 'minecraftDep': minecraftDep, 'javaVersion': javaVersion, 'forgeVersionRange': forgeVersionRange
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(project.javaVersion)
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(project.javaVersion)
	targetCompatibility = JavaVersion.toVersion(project.javaVersion)
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from(rootProject.file('LICENSE')) {
		rename { "${it}_$projectName" }
	}
}

if (!useOfficialRuntime) {
	reobf {
		jar {}
	}

	tasks.named('jar').configure {
		finalizedBy tasks.named('reobfJar')
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifact jar
		}
	}

	repositories {
	}
}
