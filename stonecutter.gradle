plugins {
	id 'dev.kikugie.stonecutter'
}
stonecutter.active '1.21.1' /* [SC] DO NOT EDIT */

// No root 'build' / 'publishMods' tasks and no CI task-disabling guard.
//
// Both existed only for release-actions v1, which ran 'gradlew build' and
// 'gradlew publishMods' UNQUALIFIED: Gradle's name matching fanned those out
// to every Stonecutter subproject, compiling versions the tag did not care
// about and - at publish time - uploading every jar for every tag. The guard
// disabled tasks outside the -PminecraftVersion subproject to contain that.
//
// v2 never issues an unqualified task. A per-MC-version target declares
// buildCommand ':{mc}:build' in .github/moogs-publish.yml, so v2/build.py runs
// one qualified invocation per MC version on that version's own JDK, and
// publishing is not Gradle's job at all (reconcile uploads natively). Both
// mechanisms are therefore removed together rather than left half-live.
