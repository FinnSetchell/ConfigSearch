pluginManagement {
	repositories {
		maven {
			name = 'MinecraftForge'
			url = 'https://maven.minecraftforge.net/'
		}
		maven {
			name = 'KikuGie'
			url = 'https://maven.kikugie.dev/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.6'
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

stonecutter {
	shared {
		vcsVersion = '1.21.1'
		version('1.20.1', '1.20.1').buildscript('build.gradle')
		version('1.21.1', '1.21.1').buildscript('build.gradle')
		version('26.3', '26.3').buildscript('build.gradle')
	}
	create rootProject
}

rootProject.name = 'configsearch'
