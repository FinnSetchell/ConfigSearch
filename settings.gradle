pluginManagement {
	repositories {
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		maven {
			name = 'KikuGie'
			url = 'https://maven.kikugie.dev/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.6'
}

stonecutter {
	shared {
		vcsVersion = '1.21.1'
		version('1.21.1', '1.21.1').buildscript('build.gradle')
		version('1.21.11', '1.21.11').buildscript('build.gradle')
		version('26.1.2', '26.1.2').buildscript('build.gradle')
		version('26.2', '26.2').buildscript('build.gradle')
	}
	create rootProject
}

rootProject.name = 'configsearch'
