pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'KikuGie'
			url = 'https://maven.kikugie.dev/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.6'
}

stonecutter {
	shared {
		vcsVersion = '1.21.1'
		version('1.20.1', '1.20.1').buildscript('build-obfuscated.gradle')
		version('1.21.1', '1.21.1').buildscript('build-obfuscated.gradle')
		version('1.21.11', '1.21.11').buildscript('build-obfuscated.gradle')
		version('26.2', '26.2').buildscript('build-unobfuscated.gradle')
	}
	create rootProject
}

rootProject.name = 'configsearch'
